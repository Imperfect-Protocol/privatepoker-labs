<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <!-- Skynerd swarm splash — LinkedIn article cover (1200x627) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140b26"/>
      <stop offset="0.35" stop-color="#4a1430"/>
      <stop offset="0.62" stop-color="#93321a"/>
      <stop offset="0.85" stop-color="#e05a12"/>
      <stop offset="1" stop-color="#ff8c2a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.55" stop-color="#ffb84a"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0.0"/>
    </radialGradient>
    <radialGradient id="fire" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#fff8d0"/>
      <stop offset="0.35" stop-color="#ffd24a"/>
      <stop offset="0.7" stop-color="#ff7a12"/>
      <stop offset="1" stop-color="#b3300a" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a2a12"/>
      <stop offset="0.4" stop-color="#331809"/>
      <stop offset="1" stop-color="#140a05"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a3a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9a3a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="smoke" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2a0f06"/>
      <stop offset="1" stop-color="#0d0604" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23262c"/>
      <stop offset="0.55" stop-color="#101318"/>
      <stop offset="1" stop-color="#1c1712"/>
    </linearGradient>
    <linearGradient id="winglight" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0" stop-color="#181b20"/>
      <stop offset="0.7" stop-color="#101318"/>
      <stop offset="1" stop-color="#3a2313"/>
    </linearGradient>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur14"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur30"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>

  <!-- sky -->
  <rect width="1200" height="430" fill="url(#sky)"/>

  <!-- huge sun at the horizon -->
  <circle cx="610" cy="418" r="230" fill="url(#sun)" opacity="0.55"/>
  <circle cx="610" cy="418" r="140" fill="url(#sun)"/>
  <circle cx="610" cy="418" r="96" fill="#ffdf8a" opacity="0.95"/>
  <circle cx="610" cy="418" r="72" fill="#fff2b8"/>

  <!-- distant desert mountains -->
  <path d="M0 402 L90 372 L150 388 L235 352 L310 384 L370 366 L455 398 L520 380 L610 404 L700 372 L780 392 L870 356 L950 390 L1030 368 L1120 398 L1200 376 L1200 432 L0 432 Z"
        fill="#3a1630" opacity="0.85"/>
  <path d="M0 418 L110 396 L200 412 L320 392 L430 416 L560 400 L680 420 L800 398 L920 418 L1040 402 L1200 422 L1200 436 L0 436 Z"
        fill="#260f20" opacity="0.9"/>
  <!-- atmospheric haze on the ridges -->
  <rect x="0" y="380" width="1200" height="52" fill="url(#haze)"/>

  <!-- desert floor -->
  <rect x="0" y="430" width="1200" height="197" fill="url(#ground)"/>
  <path d="M0 470 C300 458 700 462 1200 474 L1200 500 C700 486 300 484 0 496 Z" fill="#1c0d06" opacity="0.55"/>
  <path d="M0 560 C400 545 800 552 1200 566 L1200 627 L0 627 Z" fill="#0d0603" opacity="0.75"/>

  <!-- burning tank, behind and below the drone -->
  <g>
    <!-- smoke columns -->
    <path d="M845 470 C830 420 858 390 840 340 C828 300 852 270 838 215 L900 215 C888 280 912 320 898 372 C886 420 908 445 905 472 Z"
          fill="url(#smoke)" opacity="0.85"/>
    <path d="M960 492 C950 455 968 430 956 390 C948 358 966 335 958 300 L1006 300 C998 345 1012 380 1000 420 C992 452 1008 470 1006 494 Z"
          fill="url(#smoke)" opacity="0.7"/>
    <!-- hull and turret silhouette -->
    <path d="M812 500 L848 486 L918 484 L952 494 L948 512 L816 514 Z" fill="#0b0503"/>
    <path d="M872 470 L918 466 L936 486 L864 488 Z" fill="#0b0503"/>
    <rect x="920" y="474" width="52" height="6" rx="3" fill="#0b0503" transform="rotate(-8 920 474)"/>
    <!-- main fireball -->
    <circle cx="884" cy="478" r="58" fill="url(#fire)" filter="url(#blur6)"/>
    <circle cx="884" cy="478" r="26" fill="#fff0a8"/>
    <!-- secondary blast -->
    <circle cx="982" cy="496" r="34" fill="url(#fire)" filter="url(#blur6)" opacity="0.9"/>
    <!-- ground scorch and fire glow -->
    <ellipse cx="886" cy="514" rx="150" ry="16" fill="#ff8220" opacity="0.25" filter="url(#blur14)"/>
    <ellipse cx="886" cy="516" rx="90" ry="9" fill="#ffb050" opacity="0.3" filter="url(#blur6)"/>
  </g>

  <!-- warm ambient glow over the whole floor -->
  <rect x="0" y="430" width="1200" height="197" fill="#ff7a1a" opacity="0.08"/>

  <!-- ===================== THE CARPET WAVE ===================== -->
  <!-- one reusable silhouette; the swarm flies in loose carpet rows -->
  <g id="waveDefs">
    <g id="uav">
      <!-- wing -->
      <path d="M-44 0 C-14 5 14 5 44 0 L44 3.5 C14 9 -14 9 -44 3.5 Z"/>
      <!-- fuselage -->
      <path d="M-13 -2 C-5 4 5 4 13 -2 L8 -7 L-8 -7 Z"/>
      <!-- v-tail -->
      <path d="M-11 -6 L-18 -14 L-15 -15 L-8 -8 Z"/>
      <path d="M11 -6 L18 -14 L15 -15 L8 -8 Z"/>
    </g>
  </g>
  <g fill="#1a0f0a">
    <!-- near row (just behind the hero, still fairly large, warm underlit) -->
    <use href="#uav" transform="translate(180 150) scale(1.15) rotate(-4)" fill="#2a1409"/>
    <use href="#uav" transform="translate(700 130) scale(1.05) rotate(3)" fill="#2a1409"/>
    <use href="#uav" transform="translate(940 190) scale(1.0) rotate(-2)" fill="#241108"/>
    <use href="#uav" transform="translate(430 96) scale(0.9) rotate(5)" fill="#241108"/>
    <!-- mid rows, smaller, drifting toward the sun -->
    <use href="#uav" transform="translate(90 250) scale(0.62) rotate(-6)"/>
    <use href="#uav" transform="translate(320 208) scale(0.55) rotate(4)"/>
    <use href="#uav" transform="translate(560 246) scale(0.5) rotate(-3)"/>
    <use href="#uav" transform="translate(820 118) scale(0.58) rotate(6)"/>
    <use href="#uav" transform="translate(1080 132) scale(0.5) rotate(-4)"/>
    <use href="#uav" transform="translate(1010 286) scale(0.45) rotate(2)"/>
    <use href="#uav" transform="translate(200 330) scale(0.42) rotate(-5)"/>
    <use href="#uav" transform="translate(490 330) scale(0.38) rotate(3)"/>
    <use href="#uav" transform="translate(760 320) scale(0.36) rotate(-2)"/>
    <!-- far rows: tiny, hazy, backlit against the sun glow -->
    <g opacity="0.75" filter="url(#blur6)">
      <use href="#uav" transform="translate(150 190) scale(0.28) rotate(4)"/>
      <use href="#uav" transform="translate(390 156) scale(0.24) rotate(-3)"/>
      <use href="#uav" transform="translate(640 176) scale(0.26) rotate(5)"/>
      <use href="#uav" transform="translate(900 84) scale(0.22) rotate(-5)"/>
      <use href="#uav" transform="translate(1150 210) scale(0.25) rotate(3)"/>
      <use href="#uav" transform="translate(540 60) scale(0.2) rotate(-4)"/>
      <use href="#uav" transform="translate(60 120) scale(0.22) rotate(6)"/>
      <use href="#uav" transform="translate(1050 60) scale(0.18) rotate(-2)"/>
      <use href="#uav" transform="translate(340 404) scale(0.2) rotate(2)"/>
      <use href="#uav" transform="translate(680 388) scale(0.18) rotate(-3)"/>
      <use href="#uav" transform="translate(1090 380) scale(0.2) rotate(4)"/>
    </g>
  </g>

  <!-- ===================== THE DRONE ===================== -->
  <!-- above the camera, hull upper-left, seen from front-below, slight bank -->
  <g>
    <!-- left wing: long, sweeps off the RIGHT edge of the frame -->
    <path d="M330 232 C560 236 880 240 1210 246 L1210 306 C900 296 640 296 352 306 C342 282 336 256 330 232 Z"
          fill="url(#winglight)"/>
    <!-- warm rim on the wing underside (lit by the burning ground) -->
    <path d="M352 306 C640 296 900 296 1210 306 L1210 313 C900 303 640 303 356 313 Z"
          fill="#ff8c3a" opacity="0.55" filter="url(#blur6)"/>
    <!-- left wingtip nav light (red) near the frame edge -->
    <circle cx="1180" cy="274" r="4.5" fill="#ff2a1a" opacity="0.95" filter="url(#blur6)"/>
    <circle cx="1180" cy="274" r="2" fill="#ffb0a0"/>

    <!-- right wing: small stub toward the LEFT (foreshortened, pointing away) -->
    <path d="M322 226 C260 214 200 202 128 190 L118 208 C196 224 258 238 318 252 Z"
          fill="#0c0e12"/>
    <path d="M118 208 C196 224 258 238 318 252 L316 259 C254 245 192 231 114 214 Z"
          fill="#ff8c3a" opacity="0.4" filter="url(#blur6)"/>
    <circle cx="130" cy="200" r="4" fill="#22ff5a" opacity="0.9" filter="url(#blur6)"/>

    <!-- fuselage: nose toward us (lower-left), tail up-right -->
    <path d="M212 288
             C246 322 318 314 402 272
             C462 242 520 210 556 186
             C570 176 572 158 558 150
             C528 136 470 158 396 192
             C322 226 250 248 220 258
             C204 264 202 276 212 288 Z"
          fill="url(#belly)"/>
    <!-- belly rim light from the fires below -->
    <path d="M214 290 C250 322 320 314 404 272 C464 242 520 210 556 186 L560 192 C522 218 464 250 406 280 C322 322 248 330 210 296 Z"
          fill="#ff8c3a" opacity="0.6" filter="url(#blur6)"/>
    <!-- spine highlight (sunset rim from behind) -->
    <path d="M222 258 C252 248 322 226 396 192 C470 158 528 136 558 150 L556 156 C526 144 468 166 398 198 C324 232 256 254 226 264 Z"
          fill="#ffb060" opacity="0.35" filter="url(#blur6)"/>

    <!-- sensor turret under the nose -->
    <circle cx="252" cy="292" r="24" fill="#181a1e"/>
    <circle cx="252" cy="292" r="24" fill="none" stroke="#ff9a4a" stroke-width="1.6" opacity="0.5"/>
    <circle cx="246" cy="296" r="9" fill="#2a3a44"/>
    <circle cx="243" cy="293" r="3" fill="#9fd8ff" opacity="0.85"/>

    <!-- V-tail fins -->
    <path d="M500 158 L556 108 L572 116 L536 168 Z" fill="#101318"/>
    <path d="M528 190 L594 158 L604 170 L552 200 Z" fill="#0c0e12"/>
    <path d="M500 158 L556 108 L560 112 L506 162 Z" fill="#ff9a4a" opacity="0.3"/>

    <!-- hard panel line on the fuselage -->
    <path d="M238 272 C320 296 460 232 552 176" fill="none" stroke="#000000" stroke-width="1.4" opacity="0.5"/>

    <!-- engine exhaust glow behind the tail -->
    <ellipse cx="596" cy="150" rx="26" ry="10" fill="#ff7a1a" opacity="0.4" filter="url(#blur14)" transform="rotate(-24 596 150)"/>
  </g>

  <!-- faint stars, top corners -->
  <g fill="#ffffff">
    <circle cx="80" cy="40" r="1.2" opacity="0.7"/>
    <circle cx="180" cy="76" r="1" opacity="0.5"/>
    <circle cx="320" cy="30" r="1.1" opacity="0.6"/>
    <circle cx="700" cy="52" r="1" opacity="0.45"/>
    <circle cx="980" cy="34" r="1.2" opacity="0.65"/>
    <circle cx="1120" cy="90" r="1" opacity="0.5"/>
    <circle cx="880" cy="70" r="0.9" opacity="0.4"/>
  </g>

  <!-- film grain-ish vignette -->
  <rect width="1200" height="627" fill="none"/>
  <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
    <stop offset="0.7" stop-color="#000000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
  </radialGradient>
  <rect width="1200" height="627" fill="url(#vig)"/>
</svg>
